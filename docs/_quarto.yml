project:
  type: website
  output-dir: _site
  preview:
    port: 4848

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles/styles.css
    toc: true
    table-scroll: true
    include-in-header: version-switcher.html

website:
  title: CaML - Causal ML
  favicon: assets/logo_no_text.svg
  page-navigation: true
  open-graph: true
  back-to-top-navigation: true
  repo-url: https://github.com/jakepenzak/caml
  repo-actions: [edit, issue]
  repo-branch: main
  repo-subdir: docs
  issue-url: https://github.com/jakepenzak/caml/issues/new

  navbar:
    logo: "assets/logo_no_text.svg"
    title: false
    background: "white"
    search: true
    border: true
    tools:
      - icon: github
        menu:
          - text: Source code
            url: https://github.com/jakepenzak/caml
          - text: Report Issue
            url: https://github.com/jakepenzak/caml/issues/new

    left:
      - sidebar:Home
      - sidebar:Concepts
      - sidebar:Examples
      - sidebar:API_Reference

    right:
      - sidebar:Contributors

  sidebar:
    - id: ""
    - id: Home
      title: "Home"
      style: floating
      contents:
        - text: Welcome!
          href: index.qmd
        - 01_Home/installation.qmd
        - 01_Home/quickstart.qmd
    - id: Concepts
      title: "Concepts"
      style: floating
      contents:
        - 02_Concepts/motivation.qmd
        - 02_Concepts/theory.qmd
        - 02_Concepts/models.qmd
        - 02_Concepts/references.qmd
    # - id: Examples
    #   title: "Examples"
    #   style: floating
      # contents: 03_Examples/*
    - id: API_Reference
      title: "Reference"
      style: floating
      contents:
        - 04_Reference/index.qmd
        - 04_Reference/support_matrix.qmd
    - id: Contributors
      title: "Contributors"
      style: floating
      contents:
        - 05_Contributors/getting_started.qmd
        - 05_Contributors/environment.qmd
        - 05_Contributors/documentation.qmd
        - 05_Contributors/testing.qmd
        - 05_Contributors/conventional_commits.qmd

  page-footer:
    border: false
    left: "© Copyright 2024, Jacob Pieniazek"
    right: |
      Powered by: [![](/assets/external_logos/quarto.png){width=85px}](https://quarto.org/)

quartodoc:
  package: caml
  dir: 04_Reference
  title: API Reference
  sidebar: 04_Reference/_sidebar.yml
  source_dir: ../caml
  renderer:
    style: _extensions.renderer_with_source.py
  sections:
    - title: CaML Estimators
      desc: Core CaML estimators for causal effects, organized by input data structure.
    - subtitle: Cross-Sectional Estimators
      desc: "`from caml.cross_section import *` \n \n Econometric estimators for causal effects with cross-sectional data."
      package: caml.cross_section
      contents:
          - name: InteractiveLinearRegression
            member_order: source
        # - name: AutoCATE
        #   member_order: source
    - subtitle: Panel Estimators
      desc: "Econometric estimators for causal effects with panel data. \n \n *Forthcoming* "
      package: caml.panel
    - subtitle: Time Series Estimators
      desc: "Econometric estimators for causal effects with time series data. \n \n *Forthcoming* "
      package: caml.time_series

    - title: CaML Extensions
      desc: Additional utilities and tools for working with CaML.
    - subtitle: Synthetic Data Generation
      desc: "`from caml.synthetic_data import *` <br> <br> Synthetic data generation utilities for CaML."
      package: caml.synthetic_data
      contents:
        - name: SyntheticDataGenerator
          signature_name: short
        - name: make_partially_linear_dataset_simple
          signature_name: short
        - name: make_partially_linear_dataset_constant
          signature_name: short
        - name: make_fully_heterogeneous_dataset
          signature_name: short
    - subtitle: Plots
      desc: "`from caml.plots import *` <br> <br> Plotting utilities for CaML."
      package: caml.plots
      contents:
        - name: cate_histogram_plot
          signature_name: short
        - name: cate_line_plot
          signature_name: short
        - name: cate_true_vs_estimated_plot
          signature_name: short
    # - title: Developer Tools
    #   desc: "Developer tools and utilities for CaML."
    #   contents:
    #     - name: decorators
    #       package: caml.generics
    #     - name: interfaces
    #       package: caml.generics
    #     - name: utils
    #       package: caml.generics
    #     - name: logging
    #       package: caml.generics

metadata-files:
  - _sidebar.yml
